<!doctype html>
<html lang="id" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Spotify – Web Player</title>
<style>
/* Spotify encore design tokens, observed live on open.spotify.com */
:root{
  --background-base:#121212; --background-highlight:#1f1f1f; --background-press:#000;
  --background-elevated-base:#181818; --background-elevated-highlight:#232323;
  --background-tinted-base:#ffffff1a;
  --text-base:#fff; --text-subdued:#b3b3b3; --text-bright-accent:#1ed760;
  --text-negative:#f3727f;
  --essential-base:#fff; --essential-subdued:#7c7c7c; --essential-bright-accent:#1ed760;
  --decorative-subdued:#292929;
  --left-sidebar-width:232px; --content-spacing:16px; --content-max-width:1955px;
  --encore-button-radius:9999px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--background-base);color:var(--text-base);
  font-family:"CircularSp","CircularSpTitle","CircularSpArabic","CircularSpHebrew","CircularSpVietnamese",
    "CircularCyrl",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
svg{width:16px;height:16px;fill:currentColor}
input{font:inherit}

/* ---- global 3-row grid: topbar / main / now-playing-bar ---- */
.app{display:grid;height:100vh;
  grid-template-columns:var(--left-sidebar-width) 1fr;
  grid-template-rows:64px 1fr 88px;
  grid-template-areas:"topbar topbar" "side main" "npb npb"}

/* ---- top bar ---- */
.topbar{grid-area:topbar;display:flex;align-items:center;gap:8px;padding:0 16px;
  background:var(--background-base);border-bottom:1px solid rgba(255,255,255,.06);z-index:3}
.topbar .nav-btn{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:8px;
  color:var(--text-subdued);font-weight:700;font-size:14px}
.topbar .nav-btn:hover{color:var(--text-base);background:var(--background-highlight)}
.topbar .nav-btn.active{color:var(--text-base)}
.topbar .search{flex:0 1 364px;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;
  border-radius:8px;background:var(--background-highlight);color:var(--text-subdued)}
.topbar .search svg{flex:0 0 16px;fill:var(--essential-subdued)}
.topbar .search input{flex:1;background:none;border:0;outline:0;color:var(--text-base);min-width:0}
.topbar .spacer{flex:1}
.topbar .icon-btn{width:48px;height:48px;border-radius:8px;color:var(--essential-subdued);display:grid;place-items:center}
.topbar .icon-btn:hover{color:var(--essential-base);background:var(--background-highlight)}
.topbar .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1ed760,#0d72ea);
  display:grid;place-items:center;font-weight:800;font-size:13px;color:#000}

/* ---- left sidebar ---- */
.sidebar{grid-area:side;background:var(--background-base);overflow:hidden;display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,.06)}
.side-nav{padding:8px 12px}
.side-link{display:flex;align-items:center;gap:16px;height:40px;padding:0 12px;border-radius:8px;
  color:var(--text-subdued);font-weight:700;font-size:14px}
.side-link:hover{color:var(--text-base);background:var(--background-highlight)}
.side-link.active{color:var(--text-base)}
.side-link svg{flex:0 0 24px;fill:currentColor}
.side-lib{flex:1;overflow-y:auto;padding:8px 12px;min-height:0}
.side-lib-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
  color:var(--text-subdued);font-weight:700;font-size:14px}
.side-lib-head:hover{color:var(--text-base)}
.lib-list{display:flex;flex-direction:column;gap:2px;padding:4px 0 24px}
.lib-item{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px;border-radius:8px;cursor:pointer}
.lib-item:hover{background:var(--background-highlight)}
.lib-item .art{width:48px;height:48px;border-radius:4px;flex:0 0 48px;background:var(--decorative-subdued);overflow:hidden}
.lib-item .meta{min-width:0}
.lib-item .t{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-item .s{display:block;font-size:11px;color:var(--text-subdued);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- main scroll area ---- */
.main{grid-area:main;overflow-y:auto;min-width:0;scroll-behavior:smooth}
.main::-webkit-scrollbar,.side-lib::-webkit-scrollbar{width:12px}
.main::-webkit-scrollbar-thumb,.side-lib::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:12px;
  border:3px solid var(--background-base)}
.hero{position:sticky;top:0;z-index:2;padding:8px 24px 16px;background:linear-gradient(#1f1f1f,#121212);
  display:flex;align-items:flex-end;gap:24px;min-height:64px}
.chips{display:flex;gap:8px;padding:0 24px 16px;flex-wrap:wrap;position:sticky;top:0;background:var(--background-base);z-index:1}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--background-elevated-highlight);
  color:var(--text-base);font-size:13px;font-weight:500;display:grid;place-items:center}
.chip.active{background:var(--text-base);color:#000}
.content{padding:4px 24px 24px;max-width:var(--content-max-width)}

/* ---- shelves & cards ---- */
.shelf{margin-bottom:32px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
.shelf-head h2{font-size:24px;font-weight:700;letter-spacing:-.04em;margin:0}
.show-all{font-size:13px;font-weight:700;color:var(--text-subdued);letter-spacing:.04em}
.show-all:hover{color:var(--text-base)}
.shelf-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--content-spacing)}
.card{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:8px;background:var(--background-elevated-base);
  transition:background .2s;position:relative}
.card:hover{background:var(--background-elevated-highlight)}
.card-art{position:relative;width:100%;aspect-ratio:1;border-radius:4px;overflow:hidden;
  background:var(--decorative-subdued);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card-art .ph{width:100%;height:100%}
.card-play{position:absolute;right:8px;bottom:8px;width:48px;height:48px;border-radius:50%;
  background:var(--text-bright-accent);color:#000;display:grid;place-items:center;
  opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.card-play svg{width:20px;height:20px}
.card:hover .card-play{opacity:1;transform:none}
.card-meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.card-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:14px;color:var(--text-subdued);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:block}

/* ---- now playing bar ---- */
.npb{grid-area:npb;display:grid;grid-template-columns:minmax(180px,1fr) 2fr minmax(180px,1fr);
  align-items:center;background:#000;border-top:1px solid rgba(255,255,255,.08);padding:0 12px;min-height:88px}
.npb-left{display:flex;align-items:center;gap:12px;min-width:0}
.npb-left .art{width:56px;height:56px;border-radius:4px;flex:0 0 56px;background:var(--decorative-subdued);overflow:hidden}
.npb-left .meta{min-width:0}
.npb-left .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npb-left .s{font-size:11px;color:var(--text-subdued);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npb-left .s a:hover{color:var(--text-base);text-decoration:underline}
.npb-center{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:722px;margin:0 auto;width:100%}
.controls{display:flex;align-items:center;gap:16px}
.ctrl{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--essential-subdued)}
.ctrl:hover{color:var(--essential-base)}
.ctrl.play{width:40px;height:40px;border-radius:50%;background:var(--essential-base);color:#000}
.ctrl.play:hover{transform:scale(1.06)}
.ctrl.play svg{width:16px;height:16px}
.progress{display:flex;align-items:center;gap:8px;width:100%;font-size:11px;color:var(--text-subdued)}
.progress .bar{flex:1;height:4px;border-radius:2px;background:#4d4d4d;position:relative;cursor:pointer}
.progress .bar .fill{position:absolute;left:0;top:0;bottom:0;width:23%;border-radius:2px;background:var(--essential-base)}
.progress .bar:hover .fill{background:var(--essential-bright-accent)}
.npb-right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.slider{width:96px;height:4px;border-radius:2px;background:#4d4d4d;position:relative;cursor:pointer}
.slider .fill{position:absolute;left:0;top:0;bottom:0;width:65%;border-radius:2px;background:var(--essential-base)}
.slider:hover .fill{background:var(--essential-bright-accent)}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-areas:"topbar" "main" "npb"}
  .sidebar{display:none}
  .npb{grid-template-columns:1fr auto}
  .npb-right{display:none}
  .shelf-cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('appData').textContent);
  var content = document.getElementById('content');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  DATA.shelves.forEach(function(shelf){
    if(!shelf.title || !shelf.cards.length) return;
    var sec = document.createElement('section');
    sec.className = 'shelf';
    var cards = shelf.cards.slice(0,10).map(function(c){
      var art = c.img
        ? '<img src="'+esc(c.img)+'" alt="" loading="lazy">'
        : '<div class="ph"></div>';
      return '<a class="card" href="'+esc(c.h)+'" draggable="false">'
        + '<div class="card-art">'+art+'<button class="card-play" aria-label="Play '+esc(c.t)+'">'
        + '<svg viewBox="0 0 24 24"><path d="M7.05 3.606l13.49 7.394a1 1 0 0 1 0 1.745l-13.49 7.394A1 1 0 0 1 5.6 18.346V5.654a1 1 0 0 1 1.45-.894z"/></svg>'
        + '</button></div>'
        + '<div class="card-meta"><span class="card-title" title="'+esc(c.t)+'">'+esc(c.t)+'</span>'
        + '<span class="card-sub">'+esc(c.sub||'')+'</span></div></a>';
    }).join('');
    sec.innerHTML = '<div class="shelf-head"><h2>'+esc(shelf.title)+'</h2>'
      + '<button class="show-all">Show all</button></div>'
      + '<div class="shelf-cards">'+cards+'</div>';
    content.appendChild(sec);
  });

  // library sidebar: first 14 playlist-ish cards from the top shelves
  var lib = [], seen = {};
  DATA.shelves.forEach(function(s){ s.cards.forEach(function(c){
    if(lib.length>=14 || seen[c.h]) return;
    if(c.h.indexOf('/playlist')===0 || c.h.indexOf('/album')===0){ seen[c.h]=1; lib.push(c); }
  });});
  document.getElementById('libList').innerHTML = lib.map(function(c){
    var art = c.img ? '<img src="'+esc(c.img)+'" alt="">' : '';
    return '<a class="lib-item" href="'+esc(c.h)+'"><div class="art">'+art+'</div>'
      + '<div class="meta"><span class="t">'+esc(c.t)+'</span>'
      + '<span class="s">'+esc(c.h.indexOf('/playlist')===0?'Playlist':'Album')+'</span></div></a>';
  }).join('');

  // progress bar scrub
  var bar = document.getElementById('progBar'), fill = document.getElementById('progFill');
  bar.addEventListener('click', function(e){
    var r = bar.getBoundingClientRect();
    fill.style.width = ((e.clientX - r.left) / r.width * 100) + '%';
  });
  var vol = document.getElementById('volSlider');
  vol.addEventListener('click', function(e){
    var r = vol.getBoundingClientRect();
    vol.querySelector('.fill').style.width = ((e.clientX - r.left) / r.width * 100) + '%';
  });

  // play/pause toggle
  var playing = false, btn = document.getElementById('playBtn');
  var PLAY = '<svg viewBox="0 0 16 16"><path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"/></svg>';
  var PAUSE = '<svg viewBox="0 0 16 16"><path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>';
  btn.addEventListener('click', function(){ playing = !playing; btn.innerHTML = playing ? PAUSE : PLAY;
    btn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); });

  // card click -> load into now playing bar (demo interactivity)
  document.addEventListener('click', function(e){
    var card = e.target.closest('.card'); if(!card) return;
    e.preventDefault();
    var t = card.querySelector('.card-title').textContent;
    document.getElementById('npTitle').textContent = t;
    var img = card.querySelector('.card-art img');
    document.getElementById('npArt').innerHTML = img
      ? '<img src="'+img.getAttribute('src')+'" alt="">' : '';
  });

  // chip filter (visual only)
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){
      document.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active'); });
      c.classList.add('active');
    });
  });
})();
</script>
</body>
</html>
